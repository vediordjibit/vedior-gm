runConfig:
  runtime: nodejs20
  concurrency: 100
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10

env:
  - variable: NODE_ENV
    value: production

  - variable: GROQ_API_KEY
    secret: GROQ_API_KEY

  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY

  - variable: ADMIN_SDK_KEY
    secret: FIREBASE_SERVICE_ACCOUNT
    availability:
      - RUNTIME