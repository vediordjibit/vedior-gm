runConfig:
  runtime: nodejs20
  concurrency: 100
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10

env:
  - variable: NODE_ENV
    value: production

  - variable: GROQ_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: RESEND_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: ADMIN_SDK_KEY
    availability:
      - RUNTIME